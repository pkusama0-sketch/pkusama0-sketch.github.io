<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Layali Arabia | ليالي عربية</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: linear-gradient(135deg, #fff7f2, #f8e7e7);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 24px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 12px 35px rgba(0,0,0,0.12);
    }

    .badge {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 20px;
      background: #f3f3f3;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .profile {
      width: 110px;
      height: 110px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: linear-gradient(135deg, #eeeeee, #dddddd);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 46px;
    }

    h1 {
      font-size: 26px;
      margin: 8px 0 12px;
      color: #222;
    }

    p {
      color: #666;
      font-size: 16px;
      line-height: 1.8;
      margin-bottom: 24px;
    }

    .cta {
      display: block;
      width: 100%;
      padding: 16px;
      background: #222;
      color: white;
      text-decoration: none;
      border-radius: 14px;
      font-size: 18px;
      font-weight: bold;
      transition: 0.2s;
    }

    .cta:hover {
      transform: translateY(-1px);
      opacity: 0.92;
    }

    .note {
      margin-top: 15px;
      font-size: 12px;
      color: #999;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="badge">🇸🇦 السعودية • محتوى جديد</div>

    <div class="profile">🌙</div>

    <h1>ليالي عربية ✨</h1>

    <p>
      مرحباً بك في صفحتنا ❤️
      <br>
      محتوى جديد وممتع كل يوم.
      <br>
      اضغط على الزر أدناه للمتابعة.
    </p>

    <a
      class="cta"
      href="https://www.profitableratecpmnetwork.com/t6vjpv4e3?key=aad8633069fd95d4a6dc4ce1cfc86120"
      target="_blank"
      rel="noopener noreferrer">
      متابعة ←
    </a>

    <div class="note">
      قد يتم فتح عرض من جهة خارجية عند المتابعة.
    </div>

  </div>

</body>
</html>
