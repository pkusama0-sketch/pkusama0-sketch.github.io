<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Now</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(145deg, #0b1120, #1a2639);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 40px;
      padding: 50px 30px;
      max-width: 450px;
      width: 100%;
      text-align: center;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6);
      transition: 0.3s ease;
    }
    .card:hover {
      transform: scale(1.02);
      border-color: #ff6b6b;
    }
    h1 {
      color: #ffffff;
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }
    p {
      color: #b0c4de;
      font-size: 1rem;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    .chat-btn {
      display: inline-block;
      background: linear-gradient(135deg, #ff6b6b, #ee5a24);
      color: #fff;
      font-size: 1.4rem;
      font-weight: 700;
      padding: 18px 40px;
      border: none;
      border-radius: 60px;
      text-decoration: none;
      box-shadow: 0 12px 30px rgba(238, 90, 36, 0.4);
      transition: all 0.25s ease;
      cursor: pointer;
      letter-spacing: 1px;
      width: 100%;
      max-width: 280px;
    }
    .chat-btn:hover {
      transform: translateY(-6px) scale(1.03);
      box-shadow: 0 20px 40px rgba(238, 90, 36, 0.6);
      background: linear-gradient(135deg, #ff4757, #c0392b);
    }
    .chat-btn:active {
      transform: scale(0.96);
    }
    .badge {
      display: inline-block;
      margin-top: 20px;
      background: rgba(255, 255, 255, 0.08);
      padding: 8px 18px;
      border-radius: 30px;
      color: #7f8fa6;
      font-size: 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .social-bar {
      margin: 25px 0 15px;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }
    .social-bar a {
      color: #b0c4de;
      font-size: 0.9rem;
      text-decoration: none;
      transition: 0.2s;
      padding: 6px 12px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.03);
    }
    .social-bar a:hover {
      color: #ffffff;
      background: rgba(255, 107, 107, 0.15);
    }
    @media (max-width: 480px) {
      .card { padding: 30px 20px; }
      h1 { font-size: 1.8rem; }
      .chat-btn { font-size: 1.2rem; padding: 16px 30px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>💬 Let's Chat</h1>
    <p>Tap the button below to start your conversation now.</p>

    <!-- Social Bar (Adsterra auto ads ke liye) -->
    <div class="social-bar">
      <a href="#">Facebook</a>
      <a href="#">Instagram</a>
      <a href="#">Telegram</a>
    </div>

    <!-- ✅ Click to Chat Button – SmartLink yahan daalein -->
    <a href="https://bit.ly/YOUR_SHORT_LINK" target="_blank" rel="noopener" class="chat-btn">
      👉 Click to Chat
    </a>

    <div class="badge">🔒 100% safe & secure</div>
  </div>
</body>
</html>
