<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat with Zara</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(145deg, #1a1a2e, #16213e);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 40px;
      padding: 40px 30px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6);
      transition: 0.3s ease;
    }
    .card:hover {
      transform: scale(1.02);
      border-color: #25D366;
    }
    .profile-img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #25D366;
      margin-bottom: 15px;
      box-shadow: 0 10px 30px rgba(37, 211, 102, 0.3);
    }
    h1 {
      color: #ffffff;
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 5px;
    }
    .subtitle {
      color: #b0c4de;
      font-size: 0.95rem;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .chat-btn {
      display: inline-block;
      background: linear-gradient(135deg, #25D366, #128C7E);
      color: #fff;
      font-size: 1.3rem;
      font-weight: 700;
      padding: 16px 35px;
      border: none;
      border-radius: 60px;
      text-decoration: none;
      box-shadow: 0 12px 30px rgba(37, 211, 102, 0.4);
      transition: all 0.25s ease;
      cursor: pointer;
      letter-spacing: 1px;
      width: 100%;
      max-width: 280px;
    }
    .chat-btn:hover {
      transform: translateY(-6px) scale(1.03);
      box-shadow: 0 20px 40px rgba(37, 211, 102, 0.6);
      background: linear-gradient(135deg, #20b85f, #0e6b5c);
    }
    .chat-btn:active {
      transform: scale(0.96);
    }
    .badge {
      display: inline-block;
      margin-top: 20px;
      background: rgba(255, 255, 255, 0.08);
      padding: 8px 18px;
      border-radius: 30px;
      color: #7f8fa6;
      font-size: 0.75rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .footer-text {
      margin-top: 15px;
      color: #7f8fa6;
      font-size: 0.8rem;
    }
    @media (max-width: 480px) {
      .card { padding: 30px 20px; }
      h1 { font-size: 1.6rem; }
      .chat-btn { font-size: 1.1rem; padding: 14px 25px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- Female Profile Image (Replace with your image URL) -->
    <img src="https://i.pinimg.com/736x/8b/16/7a/8b167af653c2399dd93b952a48740620.jpg" alt="Zara" class="profile-img">
    
    <h1>💬 Hi, I'm Zara</h1>
    <p class="subtitle">Tap below to chat with me on WhatsApp 💚</p>

    <!-- ✅ Click to Chat Button – SmartLink yahan daalein -->
    <a href="https://www.profitableratecpmnetwork.com/t6vjpv4e3?key=aad8633069fd95d4a6dc4ce1cfc86120" target="_blank" rel="noopener" class="chat-btn">
      👉 Click to Chat
    </a>

    <div class="badge">🔒 100% safe & private</div>
    <div class="footer-text">⚡ 500+ people already connected</div>
  </div>
</body>
</html>
